<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Evento - Cria FATEC</title>
  <link rel="stylesheet" href="src/css/style.css">
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- CABEÇALHO / NAVBAR -->
  <header class="navbar container">
    <div class="nav-brand" onclick="window.location.href='index.html'" style="cursor: pointer;">
      <h1>Cria <span>FATEC</span></h1>
      <p>Vitrine de Portfólios & Eventos</p>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL DO EVENTO -->
  <main id="app" class="container" style="padding: 40px 0;">
    <p class="loading">Carregando detalhes do evento...</p>
  </main>

  <!-- RODAPÉ -->
  <footer class="main-footer">
    <div class="footer-container container">
      <div class="footer-brand">
        <h2>Cria <span>FATEC</span></h2>
        <p>A plataforma de conexão entre os talentos criativos, estudantes e o mercado de tecnologia da FATEC.</p>
      </div>
      <div class="footer-info">
        <p class="copyright">&copy; 2026 Cria FATEC. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <!-- SCRIPT PARA CARREGAR O EVENTO DO SUPABASE -->
  <script type="module">
    // Caminho corrigido apontando para src/js/supabase.js conforme a árvore de pastas
    import { supabase } from './src/js/supabase.js';

    async function carregarDetalhesEvento() {
      const app = document.getElementById('app');
      const params = new URLSearchParams(window.location.search);
      const eventoId = params.get('id');

      if (!eventoId) {
        app.innerHTML = `
          <div style="text-align: center; color: #fff; padding: 40px;">
            <h2>Evento não especificado</h2>
            <p style="color: #aaa; margin: 15px 0;">Nenhum ID de evento foi fornecido na URL.</p>
            <a href="index.html" style="color: #279AF1; text-decoration: underline;">Voltar para o Início</a>
          </div>
        `;
        return;
      }

      const { data: evento, error } = await supabase
        .from('events')
        .select('*')
        .eq('id', eventoId)
        .single();

      if (error || !evento) {
        app.innerHTML = `
          <div style="text-align: center; color: #fff; padding: 40px;">
            <h2>Evento não encontrado</h2>
            <p style="color: #aaa; margin: 15px 0;">Este evento pode ter sido removido ou o link está incorreto.</p>
            <a href="index.html" style="color: #279AF1; text-decoration: underline;">Voltar para o Início</a>
          </div>
        `;
        return;
      }

      const dataFormatada = evento.data_evento ? new Date(evento.data_evento).toLocaleDateString('pt-BR', { timeZone: 'UTC', dateStyle: 'full' }) : 'Data a definir';
      const categoria = evento.categoria || 'Geral';

      app.innerHTML = `
        <div style="max-width: 850px; margin: 0 auto; color: #fff; text-align: left;">
          
          <a href="index.html" style="display: inline-block; background: rgba(255,255,255,0.05); border: 1px solid #333; color: #bbb; padding: 8px 16px; border-radius: 6px; text-decoration: none; margin-bottom: 25px;">
            ← Voltar ao Início
          </a>

          ${evento.imagem_url ? `
            <div style="width: 100%; max-height: 450px; overflow: hidden; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
              <img src="${evento.imagem_url}" alt="${evento.titulo}" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>
          ` : ''}

          <div style="display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;">
            <span style="background: #279AF1; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold;">🏷️ ${categoria}</span>
            <span style="background: #1e2227; border: 1px solid #333; color: #279AF1; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold;">📅 ${dataFormatada}</span>
            ${evento.local ? `<span style="background: #1e2227; border: 1px solid #333; color: #aaa; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;">📍 ${evento.local}</span>` : ''}
          </div>

          <h1 style="font-size: 2.4rem; margin-bottom: 20px; color: #fff; line-height: 1.2;">${evento.titulo}</h1>

          <div style="font-size: 1.1rem; line-height: 1.8; color: #ddd; white-space: pre-line; background: rgba(255,255,255,0.02); padding: 25px; border-radius: 10px; border-left: 5px solid #279AF1; border: 1px solid rgba(255,255,255,0.05);">
            ${evento.descricao || 'Nenhuma descrição detalhada informada para este evento.'}
          </div>
          
        </div>
      `;
    }

    carregarDetalhesEvento();
  </script>
</body>
</html>
