<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cria FATEC - Perfil do Aluno</title>
  <script>
    // Redireciona instantaneamente preservando a query string (ex: ?username=fulano) para o hash do index.html
    const search = window.location.search;
    window.location.replace('./index.html#perfil' + search);
  </script>
</head>
<body>
  <p style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif; color: #555;">Carregando perfil...</p>
</body>
</html>
